    border-radius: var(--radius) var(--radius) 0 0;

  .card[data-cat="cs-algorithms"]::before { background: var(--c-cs); }
  .card[data-cat="a-level"]::before      { background: var(--c-alevel); }
  .card[data-cat="university-cs"]::before { background: var(--c-uni); }

  .card[data-cat="cs-algorithms"] .cat-badge { background: rgba(89,176,240,0.12); color: var(--c-cs); }

    color: var(--accent2);
    font-family: 'DM Mono', monospace;

  /* hidden */
  .card.hidden { display: none; }

  /* no results */
  #no-results {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
  }

  /* ANIMATIONS */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 40px 24px;
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  footer a { color: var(--accent); text-decoration: none; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    :root { --card-w: 100%; }
    header { padding: 14px 16px 12px; }
    main { padding: 16px; }
    #grid { gap: 14px; }
    .brand h1 { font-size: 1.3rem; }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>

<script>

const FORMULAS = [
  // CORE MATH
  {
    name: "Linear Equation (Slope-Intercept)",
    cat: "core-math",
    keywords: "line slope intercept gradient straight",
    formula: ["y = mx + b"],
    what: "Describes any straight line. m = how steep the line is (slope). b = where it crosses the y-axis.",
    when: "Whenever you need to model a relationship that grows or shrinks at a constant rate — price per unit, speed, salary per hour.",
    example: "y = 3x + 5 → for every 1 unit of x, y increases by 3. At x=0, y=5."
  },
  {
    name: "Quadratic Formula",
    cat: "core-math",
    keywords: "quadratic roots parabola ax2 bx c discriminant",
    formula: ["x = (−b ± √(b² − 4ac)) / 2a"],
    what: "Finds the x-values where a curved (parabola) line crosses zero. Solves ax² + bx + c = 0.",
    when: "When you have a squared variable and need to find where something equals zero — trajectory peaks, break-even points.",

  },
  {
    name: "Discriminant",
    cat: "core-math",
    keywords: "discriminant roots nature quadratic real",
    formula: ["Δ = b² − 4ac", "Δ > 0 → 2 real roots | Δ = 0 → 1 root | Δ < 0 → no real roots"],
    what: "Tells you HOW MANY solutions a quadratic has, before doing full calculation.",
    when: "Quick check: does this equation have solutions at all?",
    example: "b²−4ac = −3 → no real solution exists."
  },
  {
    name: "Distance Formula (2D)",
    cat: "core-math",
    keywords: "distance two points euclidean 2d coordinate",
    formula: ["d = √((x₂−x₁)² + (y₂−y₁)²)"],
    what: "Straight-line distance between two points on a flat plane. Pythagoras applied to coordinates.",
    when: "Finding how far apart two things are: cities on a map, objects in a game, data points in ML.",
    example: "Points (1,2) and (4,6) → d = √(9+16) = 5."
  },
  {
    name: "Distance Formula (3D)",
    cat: "core-math",
    keywords: "distance 3d three dimensional space points",
    formula: ["d = √((x₂−x₁)² + (y₂−y₁)² + (z₂−z₁)²)"],
    what: "Same as 2D distance but adds a third dimension (depth).",
    when: "3D game engines, spatial queries, collision detection in 3D worlds.",
    example: "Points (0,0,0) and (1,2,2) → d = √(1+4+4) = 3."
  },
  {
    name: "Midpoint Formula",
    cat: "core-math",
    keywords: "midpoint middle average two points",
    formula: ["M = ((x₁+x₂)/2 , (y₁+y₂)/2)"],
    what: "Finds the exact centre point between two coordinates.",
    when: "Centering UI elements, finding midpoints of map routes, averaging positions.",
    example: "(0,0) and (4,6) → midpoint = (2,3)."
  },
  {
    name: "Laws of Indices (Exponent Rules)",
    cat: "core-math",
    keywords: "exponent power indices rules multiply divide",
    formula: ["aᵐ × aⁿ = aᵐ⁺ⁿ", "aᵐ ÷ aⁿ = aᵐ⁻ⁿ", "(aᵐ)ⁿ = aᵐⁿ", "a⁰ = 1  |  a⁻ⁿ = 1/aⁿ"],
    what: "Rules for multiplying and dividing numbers with powers.",
    when: "Simplifying expressions, understanding Big-O notation (2ⁿ), working with growth rates.",
    example: "2³ × 2⁴ = 2⁷ = 128."
  },
  {
    name: "Logarithm Rules",
    cat: "core-math",
    keywords: "logarithm log ln natural base rules",
    formula: ["log(ab) = log a + log b", "log(a/b) = log a − log b", "log(aⁿ) = n·log a", "logₐb = log b / log a"],
    what: "Logarithm is the inverse of exponentiation — it asks 'what power gives me this number?'",
    when: "Measuring scales (decibels, pH, earthquake magnitude), ML loss functions, algorithmic complexity analysis.",
    example: "log₂(8) = 3 because 2³ = 8."
  },
  {
    name: "Pythagorean Theorem",
    cat: "core-math",
    keywords: "pythagoras right angle triangle hypotenuse sides",
    formula: ["a² + b² = c²", "c = √(a² + b²)"],
    what: "In a right-angled triangle, the square of the hypotenuse equals sum of squares of other two sides.",
    when: "Any time you need to find a missing side of a right triangle. Foundation of the distance formula.",
    example: "Sides 3 and 4 → hypotenuse = √(9+16) = 5."
  },
  {
    name: "Circle: Area & Circumference",
    cat: "core-math",
    keywords: "circle area circumference radius diameter pi",
    formula: ["Area = πr²", "Circumference = 2πr = πd", "π ≈ 3.14159"],
    what: "Area = how much space inside a circle. Circumference = the perimeter (boundary length).",
    when: "UI circular components, game hitboxes, geographic radius queries.",
    example: "r=5 → Area = 78.5 units²,  Circumference = 31.4 units."
  },
  {
    name: "Sum of Arithmetic Progression (AP)",
    cat: "core-math",
    keywords: "arithmetic progression series sum AP sequence",
    formula: ["Sₙ = n/2 × (a + l)", "OR  Sₙ = n/2 × (2a + (n−1)d)", "nth term: aₙ = a + (n−1)d"],
    what: "Sum of a sequence where each term increases by the same fixed amount (d = common difference).",
    when: "Calculating total salary increments, summing equally spaced data, loop iteration analysis.",

  },
  {
    name: "Sum of Geometric Progression (GP)",

  {

    what: "Expands (a+b) raised to any power without multiplying it out repeatedly.",

  },
  {
    name: "Factorial",
    cat: "core-math",
    keywords: "factorial n! permutation combination counting",
    formula: ["n! = n × (n−1) × (n−2) × … × 1", "0! = 1  (by definition)"],
    what: "n! = total ways to arrange n distinct items.",

  {

    keywords: "permutation arrangement order P(n,r) counting",
    formula: ["P(n, r) = n! / (n − r)!"],
    what: "Number of ordered arrangements of r items chosen from n. Order matters.",
    when: "Password combinations, race finishing positions, ranking scenarios.",
    example: "P(5,2) = 5!/3! = 20. (5 people, 2 positions, ordered)."

  {
    name: "Combinations",
    cat: "core-math",
    keywords: "combination choose selection C(n,r) unordered",
    formula: ["C(n, r) = n! / (r! × (n−r)!)"],
    what: "Number of ways to choose r items from n where order does NOT matter.",
    when: "Lottery odds, selecting a team, choosing features, ML cross-validation splits.",
    example: "C(5,2) = 10. (5 items, pick any 2, order doesn't matter)."
  },

  // A-LEVEL / O-LEVEL
  {
    name: "Trigonometry: SOH CAH TOA",
    cat: "a-level",
    keywords: "trigonometry sin cos tan sine cosine tangent right triangle angle",
    formula: ["sin θ = Opposite / Hypotenuse", "cos θ = Adjacent / Hypotenuse", "tan θ = Opposite / Adjacent"],
    what: "Relates angles to side lengths in right-angled triangles.",

  },
  {
    name: "Sine Rule",

// ==============
// RENDER ENGINE
// ==============

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
const statsBar = document.getElementById('stats-bar');
const noResults = document.getElementById('no-results');

let activeCategory = 'all';
let searchQuery = '';

/** Map category key → display label */
const CAT_LABELS = {
  'core-math':       'Core Math',
  'a-level':         'A/O-Level',
  'statistics':      'Statistics',
  'machine-learning':'ML / AI',
  'cs-algorithms':   'CS / Algo',
  'game-dev':        'Game Dev',
  'finance':         'Finance',
  'university-cs':   'Uni CS/Eng',
  'university-bba':  'Uni BBA/Econ',
  'crypto':          'Crypto',
};

/** Build all cards once into DOM */
function buildCards() {
  FORMULAS.forEach((f, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.cat = f.cat;
    card.dataset.search = [
      f.name, f.cat, f.keywords || '',
      f.what, f.when, (f.example || '')
    ].join(' ').toLowerCase();

    const formulaLines = f.formula.map((line, idx) =>
      `<span class="formula-line">${escHtml(line)}</span>`
    ).join('');

    const exampleHtml = f.example
      ? `<div class="example-box">💡 ${escHtml(f.example)}</div>`
      : '';

    card.innerHTML = `
      <div class="card-top">
        <span class="card-name">${escHtml(f.name)}</span>
        <span class="cat-badge">${escHtml(CAT_LABELS[f.cat] || f.cat)}</span>
      </div>
      <div class="formula-box">${formulaLines}</div>
      <div class="desc-section">
        <span class="desc-label">What it is</span>
        <p class="desc-text">${escHtml(f.what)}</p>
      </div>
      <div class="desc-section">
        <span class="desc-label">When to use it</span>
        <p class="desc-text">${escHtml(f.when)}</p>
      </div>
      ${exampleHtml}
    `;

    grid.appendChild(card);
  });
}

/** Escape HTML */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/** Filter cards based on current category + search */
function applyFilters() {
  const cards = grid.querySelectorAll('.card');
  let visible = 0;

  cards.forEach(card => {
    const matchesCat = activeCategory === 'all' || card.dataset.cat === activeCategory;
    const matchesSearch = !searchQuery || card.dataset.search.includes(searchQuery);
    const show = matchesCat && matchesSearch;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  noResults.style.display = visible === 0 ? 'block' : 'none';
  updateStats(visible);
}

/** Update stats bar */
function updateStats(visible) {
  const total = FORMULAS.length;
  const catLabel = activeCategory === 'all' ? 'all categories' : CAT_LABELS[activeCategory] || activeCategory;
  
  statsBar.textContent = `Showing ${visible} of ${total} formulas · ${catLabel}`;
  
  if (searchQuery) {
    statsBar.textContent += ` · search: "${searchQuery}"`;
  }
}

/** Debounce helper */
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// EVENT LISTENERS
const clearBtn = document.getElementById('search-clear');

searchInput.addEventListener('input', debounce(() => {
  searchQuery = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = searchQuery ? 'block' : 'none'; 
  applyFilters();
}, 120));

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearBtn.style.display = 'none';
  searchInput.focus();
  applyFilters();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    applyFilters();
  });
});

// INIT 
buildCards();
applyFilters();
</script>
